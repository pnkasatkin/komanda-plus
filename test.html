<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Команда+ — Организационная диагностика</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2430;--muted:#6b7280;--line:#e5e7eb;--accent:#7ab800;--accent-dark:#5f9100;--accent-soft:#eef7dc;--danger:#ef4444;--radius:14px;--shadow:0 2px 10px rgba(20,25,35,.05)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{font-weight:700;font-size:20px}
.brand span{color:var(--accent)}
.sub{font-size:13px;color:var(--muted)}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:18px}
.progress-bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 24px;margin-bottom:16px}
.block-tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent-dark);background:var(--accent-soft);padding:3px 9px;border-radius:99px;margin-bottom:10px}
.q-title{font-size:18px;font-weight:600;margin:0 0 4px}
.q-hint{font-size:13px;color:var(--muted);margin:0 0 18px}
.required{color:var(--danger);margin-left:2px}
.options{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;transition:all .15s;font-size:15px}
.opt:hover{border-color:#cfd4dc;background:#fafbfc}
.opt.selected{border-color:var(--accent);background:var(--accent-soft)}
.opt input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.scale{display:flex;flex-direction:column;gap:8px}
.scale-label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:2px}
.scale-opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:all .15s}
.scale-opt:hover{border-color:#cfd4dc;background:#fafbfc}
.scale-opt.selected{border-color:var(--accent);background:var(--accent-soft)}
.scale-opt input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.scale-num{font-weight:600;width:22px;text-align:center}
.scale-text{font-size:15px}
.dont-know{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.dont-know label{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);cursor:pointer}
.dont-know input{accent-color:var(--muted);width:17px;height:17px;margin:0}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.footer .left{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;font-size:15px;padding:12px 20px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark)}
.btn-primary:disabled{background:#c7d6a3;cursor:not-allowed}
.btn-ghost{background:#fff;color:var(--text);border-color:var(--line)}
.btn-ghost:hover{border-color:#cfd4dc;background:#fafbfc}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 28px;margin-bottom:20px}
.hero h1{font-size:26px;margin:0 0 12px;line-height:1.25}
.hero p{font-size:15px;color:var(--muted);margin:0 0 18px}
.features{display:flex;flex-direction:column;gap:14px;margin:22px 0}
.feature{display:flex;gap:12px;align-items:flex-start}
.feature .ico{flex:0 0 30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.feature b{display:block;font-size:15px;margin-bottom:2px}
.feature span{font-size:14px;color:var(--muted)}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
.form-card h2{font-size:18px;margin:0 0 6px}
.form-card .hint{font-size:13px;color:var(--muted);margin:0 0 18px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=email]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
input:focus{outline:none;border-color:var(--accent)}
.form-card button{width:100%;margin-top:18px}
.fine{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
.metric{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.metric:last-child{border-bottom:none}
.metric .val{font-weight:600;text-align:right}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent-dark);font-size:12px;font-weight:600}
.badge.warn{background:#fff3d6;color:#8a6100}
.badge.bad{background:#fde7e7;color:#a02525}
.rec{margin-top:18px}
.rec h3{font-size:15px;margin:0 0 8px}
.rec ul{margin:0;padding-left:18px;font-size:14px}
.rec li{margin-bottom:6px}
.muted{color:var(--muted);font-size:13px}
.en{color:#9ca3af;font-size:11px;font-weight:400}
.hidden{display:none}
@media (max-width:480px){.card{padding:18px 16px}.q-title{font-size:17px}button{padding:11px 16px;font-size:14px}.hero{padding:24px 20px}.hero h1{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">Команда<span>+</span></div><div class="sub" id="headerSub">Поддержка онлайн</div></header>
<div class="progress hidden" id="progressWrap"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div><div id="progressText">0% пройдено</div></div>
<main id="app"></main>
</div>
<script>
var API_URL='https://script.google.com/macros/s/AKfycby6Y4-P_JF60c-TNqe_kDcAbG3cRRI3VVwYrUJFKteCniGRGxqamdzTqEnLH6YMtFUZ/exec';
var urlParams=new URLSearchParams(location.search);
var COMPANY_TOKEN=urlParams.get('c')||'';
var MODE=COMPANY_TOKEN?'survey':'landing';
var blocks=[
{id:'b1',name:'Блок 1 — Вовлечённость',questions:[
{id:'b1q1',type:'scale',title:'Мне нравится моя работа.',low:'Совсем не согласен',high:'Полностью согласен'},
{id:'b1q2',type:'scale',title:'Я чувствую себя частью команды.',low:'Совсем не согласен',high:'Полностью согласен'},
{id:'b1q3',type:'scale',title:'Я получаю эмоциональную поддержку на работе.',low:'Совсем не согласен',high:'Полностью согласен'},
{id:'b1q4',type:'scale',title:'Я проявляю инициативу сверх моих обязанностей.',low:'Совсем не согласен',high:'Полностью согласен'},
{id:'b1q5',type:'scale',title:'Я помогаю коллегам даже когда они меня об этом не просят.',low:'Совсем не согласен',high:'Полностью согласен'},
{id:'b1q6',type:'scale',title:'Я предлагаю идеи и беру на себя ответственность.',low:'Совсем не согласен',high:'Полностью согласен'},
{id:'b1q7',type:'scale',title:'Я понимаю, зачем нужна моя работа.',low:'Совсем не согласен',high:'Полностью согласен'},
{id:'b1q8',type:'scale',title:'Я знаю, как моя работа влияет на результат компании.',low:'Совсем не согласен',high:'Полностью согласен'},
{id:'b1q9',type:'scale',title:'Мне ясно, какие ожидаемые результаты от моей роли.',low:'Совсем не согласен',high:'Полностью согласен'},
{id:'b1q10',type:'scale',title:'Я чувствую личную ответственность за результат.',low:'Совсем не согласен',high:'Полностью согласен'}
]},
{id:'b2',name:'Блок 2 — Отношения и поток информации',questions:[
{id:'b2q1',type:'text',title:'Кто ваш прямой руководитель?',hint:'ФИО'},
{id:'b2q2',type:'number',title:'Сколько человек находится в вашем подчинении?',hint:'Введите число'},
{id:'b2q3',type:'scale',title:'Насколько вы понимаете устройство своей команды/отдела?',low:'Совсем не понимаю',high:'Полностью понимаю'},
{id:'b2q4',type:'scale',title:'Насколько вы понимаете, как работа вашей команды влияет на всю компанию?',low:'Совсем не понимаю',high:'Полностью понимаю'},
{id:'b2q5',type:'scale',title:'Насколько часто вам приходится обращаться в другие отделы?',low:'Никогда',high:'Очень часто'},
{id:'b2q6',type:'multi',title:'Отметьте отделы, от которых зависит работа вашего отдела',options:['Закупка','Производство','Бухгалтерия','Склад','Финансы','Юридический','IT']},
{id:'b2q7',type:'scale',title:'Часто ли вам не хватает информации от других отделов?',low:'Никогда',high:'Очень часто'},
{id:'b2q8',type:'multi',title:'Отметьте отделы, от которых вам нужно больше информации',options:['Закупка','Производство','Бухгалтерия','Склад','Финансы','Юридический','IT']},
{id:'b2q9',type:'scale',title:'Легко ли вам найти нужного человека в компании, когда он требуется?',low:'Очень сложно',high:'Очень легко'},
{id:'b2q10',type:'scale',title:'Получаете ли вы ясные инструкции от руководства?',low:'Никогда',high:'Всегда'},
{id:'b2q11',type:'text',title:'Есть ли у вас предложения по улучшению взаимодействия?',hint:'Короткий текст'},
{id:'b2q12',type:'scale',title:'Хотели бы вы больше общения с другими отделами?',low:'Совсем нет',high:'Очень хочу'}
]},
{id:'b3',name:'Блок 3 — Целеполагание и управление временем',questions:[
{id:'b3q1',type:'binary',title:'Есть ли у вас цели на 6 месяцев?',yes:'Да',no:'Нет'},
{id:'b3q2',type:'scale',title:'Насколько цели понятные и конкретные (SMART)?',low:'Совсем не конкретные',high:'Очень конкретные'},
{id:'b3q3',type:'scale',title:'Как часто вы планируете рабочий день?',low:'Никогда',high:'Каждый день'},
{id:'b3q4',type:'binary',title:'Используете ли вы список задач (to-do) / планировщик?',yes:'Да',no:'Нет'},
{id:'b3q5',type:'scale',title:'Как часто вы отслеживаете, сколько времени уходит на исполнение отдельной задачи?',low:'Никогда',high:'Всегда'},
{id:'b3q6',type:'scale',title:'Насколько легко вам расставлять приоритеты при выполнении рабочих задач?',low:'Очень сложно',high:'Очень легко'},
{id:'b3q7',type:'choice',title:'Что вас чаще всего отвлекает?',hint:'Выберите категорию',options:[{value:'internal',label:'Внутренние (перфекционизм, нерешительность)'},{value:'external',label:'Внешние (частые отвлечения, совещания)'},{value:'systemic',label:'Системные (неясные приоритеты, перегрузка)'}]},
{id:'b3q8',type:'scale',title:'Насколько хорошо вы отслеживаете прогресс по достижению своих целей?',low:'Совсем не отслеживаю',high:'Отлично отслеживаю'}
]},
{id:'b4',name:'Блок 4 — Мотивационный профиль',questions:[
{id:'b4q1',type:'choice',title:'Что вас мотивирует больше всего?',options:[{value:'achievement',label:'Интересные задачи'},{value:'compensation',label:'Деньги'},{value:'recognition',label:'Признание'},{value:'security',label:'Стабильность'}]},
{id:'b4q2',type:'choice',title:'Что важнее для вас сейчас: рост по карьерной лестнице или стабильность?',options:[{value:'growth',label:'Рост по карьерной лестнице'},{value:'security',label:'Стабильность'}]},
{id:'b4q3',type:'scale',title:'Насколько для вас важна зарплата?',low:'Совсем не важна',high:'Очень важна'},
{id:'b4q4',type:'scale',title:'Насколько для вас важно признание ваших заслуг коллегами и руководителем?',low:'Совсем не важно',high:'Очень важно'},
{id:'b4q5',type:'scale',title:'Насколько важны интересные задачи?',low:'Совсем не важны',high:'Очень важны'},
{id:'b4q6',type:'scale',title:'Насколько важен баланс работа/личная жизнь?',low:'Совсем не важен',high:'Очень важен'},
{id:'b4q7',type:'choice',title:'Что вас больше всего демотивирует?',options:[{value:'management',label:'Плохое управление: неясные ожидания, плохое руководство'},{value:'relationship',label:'Плохие отношения: конфликты, отсутствие признания'},{value:'growth',label:'Плохие перспективы роста: нет обучения, тупиковые роли'},{value:'environmental',label:'Плохие условия работы: оборудование, неудобства'}]},
{id:'b4q8',type:'choice',title:'Вы бы предпочли повышение зарплаты сейчас или обучение/развитие?',options:[{value:'compensation',label:'Повышение зарплаты сейчас'},{value:'development',label:'Обучение и развитие'}]}
]}
];
var allQuestions=[];
blocks.forEach(function(b){b.questions.forEach(function(q){var c={};for(var k in q)c[k]=q[k];c.blockId=b.id;c.blockName=b.name;allQuestions.push(c);});});
var total=allQuestions.length;
var answers={};
var current=0;
function renderLanding(){
document.getElementById('progressWrap').classList.add('hidden');
document.getElementById('headerSub').textContent='Поддержка онлайн';
var html='';
html+='<div class="hero">';
html+='<h1>Узнайте, что на самом деле происходит в вашей команде</h1>';
html+='<p>Анонимный опрос для сотрудников. Вы получаете объективную картину вовлечённости, взаимодействия отделов, эффективности управления временем и мотивации — и конкретные рекомендации, что с этим делать.</p>';
html+='<div class="features">';
html+='<div class="feature"><div class="ico">1</div><div><b>4 блока диагностики</b><span>Вовлечённость, отношения и поток информации, целеполагание, мотивация.</span></div></div>';
html+='<div class="feature"><div class="ico">2</div><div><b>38 вопросов — 10–15 минут</b><span>Сотрудники заполняют анонимно. Вы видите только агрегированные результаты.</span></div></div>';
html+='<div class="feature"><div class="ico">3</div><div><b>Отчёт с рекомендациями</b><span>Не просто цифры, а что конкретно делать: с чего начать, какой тренинг поможет.</span></div></div>';
html+='<div class="feature"><div class="ico">4</div><div><b>Оргструктура и связи</b><span>Карта того, кто с кем работает и где рвутся коммуникации.</span></div></div>';
html+='<div class="feature"><div class="ico">5</div><div><b>Индивидуальные отчёты</b><span>Каждый сотрудник получает свой личный отчёт после заполнения.</span></div></div>';
html+='</div>';
html+='<p><b>Что нужно от вас:</b> только email и название компании. Мы создадим персональную ссылку для рассылки сотрудникам и пришлём вам отчёты, когда наберётся достаточно ответов.</p>';
html+='</div>';
html+='<div class="form-card" id="formCard">';
html+='<h2>Создать опрос для своей команды</h2>';
html+='<p class="hint">Заполните поля — мы пришлём ссылку и папку с отчётами.</p>';
html+='<label for="company">Название компании или отдела</label>';
html+='<input type="text" id="company" placeholder="Например: ООО Ромашка, отдел продаж">';
html+='<label for="name">Ваше имя</label>';
html+='<input type="text" id="name" placeholder="Как к вам обращаться">';
html+='<label for="email">Email для отчётов</label>';
html+='<input type="email" id="email" placeholder="you@company.ru">';
html+='<button class="btn-primary" id="submitBtn">Создать опрос</button>';
html+='<div class="fine">Нажимая кнопку, вы соглашаетесь с обработкой персональных данных.</div>';
html+='</div>';
html+='<div class="form-card" id="successCard" style="display:none">';
html+='<div style="text-align:center"><div style="font-size:42px;line-height:1;margin-bottom:12px">OK</div>';
html+='<h2 style="margin:0 0 8px">Опрос создан</h2>';
html+='<p class="hint" style="margin-bottom:20px">Отправили ссылку и доступ к папке на ваш email.</p></div>';
html+='<label>Ссылка для рассылки сотрудникам</label>';
html+='<div style="display:flex;gap:8px"><input type="text" id="surveyLink" readonly style="flex:1">';
html+='<button class="btn-ghost" id="copyBtn" style="width:auto;margin:0">Копировать</button></div>';
html+='<p class="hint" style="margin-top:18px">Что дальше:</p>';
html+='<ul style="font-size:14px;color:var(--muted);margin:6px 0 0 18px;padding:0">';
html+='<li>Разошлите ссылку сотрудникам.</li>';
html+='<li>Когда наберётся достаточно ответов — мы соберём отчёты.</li>';
html+='<li>Вы получите письмо со ссылкой на папку с PDF-отчётами.</li>';
html+='</ul></div>';
document.getElementById('app').innerHTML=html;
document.getElementById('submitBtn').addEventListener('click',createSurvey);
document.getElementById('copyBtn').addEventListener('click',copyLink);
}
function createSurvey(){
var company=document.getElementById('company').value.trim();
var name=document.getElementById('name').value.trim();
var email=document.getElementById('email').value.trim();
var btn=document.getElementById('submitBtn');
if(!company||!name||!email){alert('Заполните все поля');return;}
btn.disabled=true;btn.textContent='Создаём...';
fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'createCompany',company:company,name:name,email:email})})
.then(function(r){return r.json();})
.then(function(data){
if(data.ok){
document.getElementById('formCard').style.display='none';
document.getElementById('successCard').style.display='block';
document.getElementById('surveyLink').value=data.surveyUrl;
window.scrollTo({top:0,behavior:'smooth'});
}else{
alert('Ошибка: '+(data.error||'неизвестная'));
btn.disabled=false;btn.textContent='Создать опрос';
}
})
.catch(function(e){
alert('Не удалось связаться с сервером: '+e.message);
btn.disabled=false;btn.textContent='Создать опрос';
});
}
function copyLink(){
var input=document.getElementById('surveyLink');
input.select();document.execCommand('copy');alert('Ссылка скопирована');
}
function startSurvey(){
document.getElementById('progressWrap').classList.remove('hidden');
current=0;
Object.keys(answers).forEach(function(k){delete answers[k];});
loadCompanyName();
renderQuestion();
}
function loadCompanyName(){
if(!COMPANY_TOKEN)return;
fetch(API_URL+'?action=getSurvey&c='+COMPANY_TOKEN)
.then(function(r){return r.json();})
.then(function(data){if(data.ok&&data.company)document.getElementById('headerSub').textContent=data.company;})
.catch(function(){});
}
function renderQuestion(){
var q=allQuestions[current];
var done=Object.keys(answers).length;
var percent=Math.round((done/total)*100);
document.getElementById('progressFill').style.width=percent+'%';
document.getElementById('progressText').textContent=percent+'% пройдено';
var body='';
var val=answers[q.id];
if(q.type==='scale'){
body+='<div class="scale-label"><span>'+q.low+'</span><span>'+q.high+'</span></div><div class="scale">';
for(var n=1;n<=5;n++){
var sel=val===n?'selected':'';
body+='<label class="scale-opt '+sel+'"><input type="radio" name="'+q.id+'" value="'+n+'" '+(val===n?'checked':'')+' data-act="select" data-id="'+q.id+'" data-val="'+n+'"><span class="scale-num">'+n+'</span><span class="scale-text">'+(n===1?q.low:n===5?q.high:'Оценка '+n)+'</span></label>';
}
body+='</div>';
}else if(q.type==='choice'){
body+='<div class="options">';
q.options.forEach(function(o){
var sel=val===o.value?'selected':'';
body+='<label class="opt '+sel+'"><input type="radio" name="'+q.id+'" value="'+o.value+'" '+(val===o.value?'checked':'')+' data-act="select" data-id="'+q.id+'" data-val="'+o.value+'"><span>'+o.label+'</span></label>';
});
body+='</div>';
}else if(q.type==='multi'){
var arr=Array.isArray(val)?val:[];
var selectedOpts=arr.filter(function(v){return q.options.indexOf(v)>=0;});
var otherVal=arr.find(function(v){return typeof v==='string'&&q.options.indexOf(v)<0&&v!=='dont_know';})||'';
body+='<div class="options">';
q.options.forEach(function(o){
var sel=selectedOpts.indexOf(o)>=0?'selected':'';
body+='<label class="opt '+sel+'"><input type="checkbox" value="'+o+'" '+(selectedOpts.indexOf(o)>=0?'checked':'')+' data-act="multi" data-id="'+q.id+'"><span>'+o+'</span></label>';
});
body+='</div>';
body+='<div style="margin-top:12px"><label class="muted" style="display:block;margin-bottom:6px">Другое (впишите свой вариант)</label><input type="text" value="'+otherVal+'" placeholder="Например: Маркетинг" data-act="other" data-id="'+q.id+'" style="width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit"></div>';
}else if(q.type==='binary'){
body+='<div class="options">';
[['1',q.yes],['0',q.no]].forEach(function(p){
var sel=val===p[0]?'selected':'';
body+='<label class="opt '+sel+'"><input type="radio" name="'+q.id+'" value="'+p[0]+'" '+(val===p[0]?'checked':'')+' data-act="select" data-id="'+q.id+'" data-val="'+p[0]+'"><span>'+p[1]+'</span></label>';
});
body+='</div>';
}else if(q.type==='text'){
body+='<input type="text" value="'+(val||'')+'" placeholder="'+(q.hint||'')+'" data-act="text" data-id="'+q.id+'" style="width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit">';
}else if(q.type==='number'){
body+='<input type="number" min="0" value="'+(val||'')+'" placeholder="'+(q.hint||'')+'" data-act="text" data-id="'+q.id+'" style="width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit">';
}
if(q.type!=='text'&&q.type!=='number'){
body+='<div class="dont-know"><label><input type="radio" name="'+q.id+'" value="dont_know" '+(val==='dont_know'?'checked':'')+' data-act="select" data-id="'+q.id+'" data-val="dont_know">Затрудняюсь ответить</label></div>';
}
var html='';
html+='<div class="card"><div class="block-tag">'+q.blockName+'</div>';
html+='<h1 class="q-title">'+q.title+'<span class="required">*</span></h1>';
if(q.hint)html+='<p class="q-hint">'+q.hint+'</p>';
html+=body+'</div>';
html+='<div class="footer"><div class="left">';
html+='<button class="btn-ghost" data-act="menu">Главное меню</button>';
if(current>0)html+='<button class="btn-ghost" data-act="prev">Назад</button>';
html+='</div>';
html+='<button class="btn-primary" id="nextBtn" '+(answers[q.id]!==undefined?'':'disabled')+' data-act="next">'+(current===total-1?'Показать результат':'Далее')+'</button>';
html+='</div>';
document.getElementById('app').innerHTML=html;
attachQuestionHandlers();
window.scrollTo({top:0,behavior:'smooth'});
}
function attachQuestionHandlers(){
document.querySelectorAll('[data-act]').forEach(function(el){
var act=el.getAttribute('data-act');
if(act==='select'){
el.addEventListener('change',function(){selectAnswer(el.getAttribute('data-id'),el.getAttribute('data-val'),false);});
}else if(act==='multi'){
el.addEventListener('change',function(){toggleMulti(el.getAttribute('data-id'),el);});
}else if(act==='other'){
el.addEventListener('input',function(){setMultiOther(el.getAttribute('data-id'),el.value);});
}else if(act==='text'){
el.addEventListener('input',function(){selectAnswer(el.getAttribute('data-id'),el.value,true);});
}else if(act==='next'){
el.addEventListener('click',next);
}else if(act==='prev'){
el.addEventListener('click',prev);
}else if(act==='menu'){
el.addEventListener('click',goMenu);
}
});
}
function selectAnswer(id,value,isText){
answers[id]=value;
if(!isText){
document.querySelectorAll('input[name="'+id+'"]').forEach(function(inp){
var lbl=inp.closest('.opt,.scale-opt');
if(lbl)lbl.classList.toggle('selected',inp.checked);
});
}
var btn=document.getElementById('nextBtn');
if(btn)btn.disabled=false;
updateProgress();
}
function toggleMulti(id,el){
var q=allQuestions.find(function(x){return x.id===id;});
var cur=Array.isArray(answers[id])?answers[id].slice():[];
var opts=cur.filter(function(v){return q.options.indexOf(v)>=0;});
var other=cur.filter(function(v){return q.options.indexOf(v)<0;});
if(el.checked){if(opts.indexOf(el.value)<0)opts.push(el.value);}
else{var i=opts.indexOf(el.value);if(i>=0)opts.splice(i,1);}
answers[id]=opts.concat(other);
el.closest('.opt').classList.toggle('selected',el.checked);
var btn=document.getElementById('nextBtn');
if(btn)btn.disabled=!(answers[id].length>0);
updateProgress();
}
function setMultiOther(id,text){
var q=allQuestions.find(function(x){return x.id===id;});
var cur=Array.isArray(answers[id])?answers[id]:[];
var opts=cur.filter(function(v){return q.options.indexOf(v)>=0;});
var trimmed=text.trim();
answers[id]=trimmed?opts.concat([trimmed]):opts;
var dk=document.querySelector('input[name="'+id+'"][value="dont_know"]');
if(dk&&trimmed)dk.checked=false;
var btn=document.getElementById('nextBtn');
if(btn)btn.disabled=!(answers[id].length>0);
updateProgress();
}
function updateProgress(){
var done=Object.keys(answers).length;
var percent=Math.round((done/total)*100);
document.getElementById('progressFill').style.width=percent+'%';
document.getElementById('progressText').textContent=percent+'% пройдено';
}
function next(){if(current<total-1){current++;renderQuestion();}else showThanks();}
function prev(){if(current>0){current--;renderQuestion();}}
function goMenu(){if(confirm('Вернуться в начало? Ответы сохранятся.')){current=0;renderQuestion();}}
function num(v){return(v==='dont_know'||v===undefined||v===''||v===null)?null:Number(v);}
function calcBlock1(){
var g=function(id){return num(answers[id]);};
var q1=g('b1q1'),q2=g('b1q2'),q3=g('b1q3'),q4=g('b1q4'),q5=g('b1q5'),q6=g('b1q6'),q7=g('b1q7'),q8=g('b1q8'),q9=g('b1q9'),q10=g('b1q10');
var vals=[q1,q2,q3,q4,q5,q6,q7,q8,q9,q10];
if(vals.indexOf(null)>=0)return null;
var EEI=(q1+q2+q3)/3,BEI=(q4+q5+q6)/3,CEI=(q7+q8+q9+q10)/4;
var score=EEI*0.40+BEI*0.35+CEI*0.25;
var level,cls;
if(score<2.5){level='Критично: серьёзная демотивация, требуется немедленное вмешательство.';cls='bad';}
else if(score<=3.5){level='Умеренно: уровень вовлечённости требует внимания.';cls='warn';}
else{level='Удовлетворительно.';cls='';}
var min=Math.min(EEI,BEI,CEI);
var focus='';
if(min===EEI)focus='Минимальная компонента — эмоциональная вовлечённость (EEI). Рекомендация: беседы 1-на-1, признание заслуг, объяснение вклада сотрудника в успех команды.';
else if(min===BEI)focus='Минимальная компонента — поведенческая вовлечённость (BEI). Рекомендация: выявить барьеры для инициативы, дать возможности для инициативных задач, наставничество.';
else focus='Минимальная компонента — понимание своего вклада (CEI). Рекомендация: сессия постановки целей по SMART, разъяснить связь роли с целями организации, обеспечить ресурсы.';
return {EEI:EEI,BEI:BEI,CEI:CEI,score:score,level:level,cls:cls,focus:focus};
}
function calcBlock2(){
var g=function(id){return num(answers[id]);};
var q3=g('b2q3'),q4=g('b2q4'),q5=g('b2q5'),q7=g('b2q7'),q9=g('b2q9'),q10=g('b2q10'),q12=g('b2q12');
var vals=[q3,q4,q5,q7,q9,q10,q12];
var UICI=null;
if(vals.indexOf(null)<0)UICI=(q3+q4+q5+q7+q9+q10+q12)/7;
var uiciLevel='',uiciCls='';
if(UICI!==null){
if(UICI<2.5){uiciLevel='Сотруднику неясна структура организации и его роль. Рекомендация: структурированная ориентация / встреча с руководителем, объяснить цели департамента, проекты и роль.';uiciCls='bad';}
else if(UICI<=3.5){uiciLevel='Умеренный пробел в понимании. Провести квартальные сессии по выравниванию стратегии; предоставить оргсхему с описанием функций.';uiciCls='warn';}
else{uiciLevel='Понимание структуры и потоков информации в норме.';uiciCls='';}
}
var silo=(q7!==null&&q7<=2)?1:0;
return {UICI:UICI,uiciLevel:uiciLevel,uiciCls:uiciCls,silo:silo};
}
function calcBlock3(){
var g=function(id){return num(answers[id]);};
var b1=answers['b3q1']==='1'?1:0;
var b4=answers['b3q4']==='1'?1:0;
var q2=g('b3q2'),q3=g('b3q3'),q5=g('b3q5'),q6=g('b3q6'),q8=g('b3q8');
var vals=[q2,q3,q5,q6,q8];
if(vals.indexOf(null)>=0)return null;
var foundation=b1+b4;
var quality=(q2+q3)/2;
var execution=(q5+q6+q8)/3;
var tmei=((foundation*0.25)+(quality*0.35)+(execution*0.40))/2;
var tmeiNorm=tmei*2;
var level,cls;
if(tmeiNorm<2.5){level='Серьёзные проблемы с управлением временем. Нужен комплексный план: аудит времени, обучение приоритизации, календарь-блокинг, еженедельные проверки.';cls='bad';}
else if(tmeiNorm<=3.5){level='Умеренные проблемы. Внедрите одну систему продуктивности (Эйзенхауэр / time-blocking / GTD), ежемесячный обзор целей.';cls='warn';}
else{level='Хорошие основы. Можно оптимизировать: батчинг задач, делегирование, стратегическое целеполагание.';cls='';}
var distr=answers['b3q7']||'';
var distrMap={internal:'Внутренние (перфекционизм, нерешительность)',external:'Внешние (отвлечения, совещания)',systemic:'Системные (неясные приоритеты, перегрузка)'};
return {foundation:foundation,quality:quality,execution:execution,tmei:tmei,tmeiNorm:tmeiNorm,level:level,cls:cls,distr:distr,distrLabel:distrMap[distr]||'—'};
}
function calcBlock4(){
var pmcMap={achievement:'Достижение — важны интересные задачи',compensation:'Компенсация — важна зарплата',recognition:'Признание — важна оценка заслуг',security:'Стабильность — важна предсказуемость'};
var pmc=pmcMap[answers['b4q1']]||'—';
var segment=answers['b4q2']==='growth'?'Стремление к росту':answers['b4q2']==='security'?'Стремление к стабильности':'—';
var g=function(id){return num(answers[id])||0;};
var rank=[
{name:'Зарплата (Compensation)',value:g('b4q3')},
{name:'Признание (Recognition)',value:g('b4q4')},
{name:'Интересные задачи (Achievement)',value:g('b4q5')},
{name:'Баланс работа/жизнь (Balance)',value:g('b4q6')}
];
rank.sort(function(a,b){return b.value-a.value;});
var demotMap={management:'Руководство (неясные ожидания, плохое управление)',relationship:'Отношения (конфликты, отсутствие признания)',growth:'Перспективы роста (нет обучения, тупиковые роли)',environmental:'Условия работы (оборудование, неудобства)'};
var demot=demotMap[answers['b4q7']]||'—';
var recMap={
achievement:['Сложные и разнообразные задачи','Кросс-функциональные проекты','Квартальные беседы по развитию','Обучение и повышение квалификации'],
compensation:['Проверка конкурентоспособности зарплаты','Прозрачная система бонусов','Финансовое планирование','Карта условий для повышения'],
recognition:['Видимость достижений','Проекты с публичным представлением результатов','Программы взаимного признания коллег'],
security:['Прозрачные карьерные треки','Детальные обсуждения безопасности работы','Роли с предсказуемыми обязанностями','Углубление экспертизы в стабильных функциях']
};
var recs=recMap[answers['b4q1']]||[];
var q8Note='';
if(answers['b4q8']==='compensation')q8Note='Вы явно выбираете повышение зарплаты — рекомендации по компенсации усиливаются.';
else if(answers['b4q8']==='development')q8Note='Вы явно выбираете развитие — рекомендации по обучению и росту усиливаются.';
return {pmc:pmc,segment:segment,rank:rank,demot:demot,recs:recs,q8Note:q8Note};
}
