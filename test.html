<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Команда+ — Организационная диагностика</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#1f2430; --muted:#6b7280;
    --line:#e5e7eb; --accent:#7ab800; --accent-dark:#5f9100;
    --accent-soft:#eef7dc; --danger:#ef4444;
    --radius:14px; --shadow:0 2px 10px rgba(20,25,35,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--text);line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:22px 16px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
  .brand{font-weight:700;font-size:20px}
  .brand span{color:var(--accent)}
  .sub{font-size:13px;color:var(--muted)}
  .progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:18px}
  .progress-bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s ease}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        box-shadow:var(--shadow);padding:26px 24px;margin-bottom:16px}
  .block-tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent-dark);
             background:var(--accent-soft);padding:3px 9px;border-radius:99px;margin-bottom:10px}
  .q-title{font-size:18px;font-weight:600;margin:0 0 4px}
  .q-hint{font-size:13px;color:var(--muted);margin:0 0 18px}
  .required{color:var(--danger);margin-left:2px}

  .options{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
       border-radius:10px;background:#fff;cursor:pointer;transition:all .15s;font-size:15px}
  .opt:hover{border-color:#cfd4dc;background:#fafbfc}
  .opt.selected{border-color:var(--accent);background:var(--accent-soft)}
  .opt input{accent-color:var(--accent);width:18px;height:18px;margin:0}

  .scale{display:flex;flex-direction:column;gap:8px}
  .scale-label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:2px}
  .scale-opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
             border-radius:10px;cursor:pointer;transition:all .15s}
  .scale-opt:hover{border-color:#cfd4dc;background:#fafbfc}
  .scale-opt.selected{border-color:var(--accent);background:var(--accent-soft)}
  .scale-opt input{accent-color:var(--accent);width:18px;height:18px;margin:0}
  .scale-num{font-weight:600;width:22px;text-align:center}
  .scale-text{font-size:15px}

  .dont-know{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
  .dont-know label{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);cursor:pointer}
  .dont-know input{accent-color:var(--muted);width:17px;height:17px;margin:0}

  .footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
  .footer .left{display:flex;gap:10px;flex-wrap:wrap}

  button{font:inherit;font-weight:600;font-size:15px;padding:12px 20px;border-radius:10px;
         border:1px solid transparent;cursor:pointer;transition:all .15s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-dark)}
  .btn-primary:disabled{background:#c7d6a3;cursor:not-allowed}
  .btn-ghost{background:#fff;color:var(--text);border-color:var(--line)}
  .btn-ghost:hover{border-color:#cfd4dc;background:#fafbfc}

  .hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        box-shadow:var(--shadow);padding:32px 28px;margin-bottom:20px}
  .hero h1{font-size:26px;margin:0 0 12px;line-height:1.25}
  .hero p{font-size:15px;color:var(--muted);margin:0 0 18px}
  .features{display:flex;flex-direction:column;gap:14px;margin:22px 0}
  .feature{display:flex;gap:12px;align-items:flex-start}
  .feature .ico{flex:0 0 30px;height:30px;border-radius:8px;background:var(--accent-soft);
                color:var(--accent-dark);display:flex;align-items:center;justify-content:center;
                font-weight:700;font-size:14px}
  .feature b{display:block;font-size:15px;margin-bottom:2px}
  .feature span{font-size:14px;color:var(--muted)}

  .form-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
             box-shadow:var(--shadow);padding:28px}
  .form-card h2{font-size:18px;margin:0 0 6px}
  .form-card .hint{font-size:13px;color:var(--muted);margin:0 0 18px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  input[type=text],input[type=email]{width:100%;padding:12px 14px;border:1px solid var(--line);
    border-radius:10px;font:inherit;background:#fff}
  input:focus{outline:none;border-color:var(--accent)}
  .form-card button{width:100%;margin-top:18px}
  .fine{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}

  .metric{display:flex;justify-content:space-between;align-items:center;gap:10px;
          padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
  .metric:last-child{border-bottom:none}
  .metric .val{font-weight:600;text-align:right}
  .badge{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--accent-soft);
         color:var(--accent-dark);font-size:12px;font-weight:600}
  .badge.warn{background:#fff3d6;color:#8a6100}
  .badge.bad{background:#fde7e7;color:#a02525}
  .rec{margin-top:18px}
  .rec h3{font-size:15px;margin:0 0 8px}
  .rec ul{margin:0;padding-left:18px;font-size:14px}
  .rec li{margin-bottom:6px}
  .muted{color:var(--muted);font-size:13px}
  .en{color:#9ca3af;font-size:11px;font-weight:400}
  .hidden{display:none}
  .box{background:#f8f9fb;border-left:3px solid var(--accent);padding:12px 16px;
       border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
  @media (max-width:480px){
    .card{padding:18px 16px}.q-title{font-size:17px}
    button{padding:11px 16px;font-size:14px}
    .hero{padding:24px 20px}.hero h1{font-size:22px}
  }
</style>
</head>
<body>

blocks.forEach(b => b.questions.forEach(q => allQuestions.push({...q, blockId:b.id, blockName:b.name})));

async function createSurvey(){
  const company = document.getElementById('company').value.trim();
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('submitBtn');

  if (!company || !name || !email){ alert('Заполните все поля'); return; }

  btn.disabled = true;
  btn.textContent = 'Создаём…';

  try {
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'createCompany', company, name, email})
    });
    const data = await res.json();
    if (data.ok){
      document.getElementById('formCard').style.display = 'none';
      document.getElementById('successCard').style.display = 'block';
      document.getElementById('surveyLink').value = data.surveyUrl;
      window.scrollTo({top:0, behavior:'smooth'});
    } else {
      alert('Ошибка: ' + (data.error || 'неизвестная'));
      btn.disabled = false; btn.textContent = 'Создать опрос';
    }
  } catch(e){
    alert('Не удалось связаться с сервером: ' + e.message);
    btn.disabled = false; btn.textContent = 'Создать опрос';
  }
}

function copyLink(){
  const input = document.getElementById('surveyLink');
  input.select();
  document.execCommand('copy');
  alert('Ссылка скопирована');
}

function startSurvey(){
  document.getElementById('progressWrap').classList.remove('hidden');
  current = 0;
  Object.keys(answers).forEach(k => delete answers[k]);
  loadCompanyName();
  renderQuestion();
}

async function loadCompanyName(){
  if (!COMPANY_TOKEN) return;
  try {
    const res = await fetch(API_URL + '?action=getSurvey&c=' + COMPANY_TOKEN);
    const data = await res.json();
    if (data.ok && data.company){
      document.getElementById('headerSub').textContent = data.company;
    }
  } catch(e){ /* игнорируем */ }
}

function renderQuestion(){
  const q = allQuestions[current];
  const done = Object.keys(answers).length;
  const percent = Math.round((done/total)*100);
  document.getElementById('progressFill').style.width = percent+'%';
  document.getElementById('progressText').textContent = percent+'% пройдено';

  let body = '';
  const val = answers[q.id];

  if (q.type === 'scale'){
    body += `<div class="scale-label"><span>${q.low}</span><span>${q.high}</span></div><div class="scale">`;
    for (let n=1;n<=5;n++){
      const sel = val===n ? 'selected':'';
      body += `<label class="scale-opt ${sel}">
        <input type="radio" name="${q.id}" value="${n}" ${val===n?'checked':''}
               onchange="selectAnswer('${q.id}', ${n})">
        <span class="scale-num">${n}</span>
        <span class="scale-text">${n===1?q.low:n===5?q.high:'Оценка '+n}</span></label>`;
    }
    body += `</div>`;
  } else if (q.type === 'choice'){
    body += `<div class="options">`;
    q.options.forEach(o=>{
      const sel = val===o.value?'selected':'';
      body += `<label class="opt ${sel}">
        <input type="radio" name="${q.id}" value="${o.value}" ${val===o.value?'checked':''}
               onchange="selectAnswer('${q.id}','${o.value}')">
        <span>${o.label}</span></label>`;
    });
    body += `</div>`;
  } else if (q.type === 'multi'){
    const arr = Array.isArray(val) ? val : [];
    const selectedOpts = arr.filter(v => q.options.includes(v));
    const otherVal = arr.find(v => typeof v === 'string' && !q.options.includes(v) && v !== 'dont_know') || '';
    body += `<div class="options">`;
    q.options.forEach(o=>{
      const sel = selectedOpts.includes(o) ? 'selected' : '';
      body += `<label class="opt ${sel}">
        <input type="checkbox" value="${o}" ${selectedOpts.includes(o)?'checked':''}
               onchange="toggleMulti('${q.id}', this)">
        <span>${o}</span></label>`;
    });
    body += `</div>`;
    body += `<div style="margin-top:12px">
      <label class="muted" style="display:block;margin-bottom:6px">Другое (впишите свой вариант)</label>
      <input type="text" value="${otherVal}" placeholder="Например: Маркетинг"
        oninput="setMultiOther('${q.id}', this.value)"
        style="width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit">
    </div>`;
  } else if (q.type === 'binary'){
    body += `<div class="options">`;
    [['1',q.yes],['0',q.no]].forEach(([v,l])=>{
      const sel = val===v?'selected':'';
      body += `<label class="opt ${sel}">
        <input type="radio" name="${q.id}" value="${v}" ${val===v?'checked':''}
               onchange="selectAnswer('${q.id}','${v}')">
        <span>${l}</span></label>`;
    });
    body += `</div>`;
  } else if (q.type === 'text'){
    body += `<input type="text" value="${val||''}" placeholder="${q.hint||''}"
      oninput="selectAnswer('${q.id}', this.value, true)"
      style="width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit">`;
  } else if (q.type === 'number'){
    body += `<input type="number" min="0" value="${val||''}" placeholder="${q.hint||''}"
      oninput="selectAnswer('${q.id}', this.value, true)"
      style="width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit">`;
  }

  if (q.type !== 'text' && q.type !== 'number'){
    body += `<div class="dont-know"><label>
      <input type="radio" name="${q.id}" value="dont_know" ${val==='dont_know'?'checked':''}
             onchange="selectAnswer('${q.id}','dont_know')">
      Затрудняюсь ответить</label></div>`;
  }

  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="block-tag">${q.blockName}</div>
      <h1 class="q-title">${q.title}<span class="required">*</span></h1>
      ${q.hint?`<p class="q-hint">${q.hint}</p>`:''}
      ${body}
    </div>
    <div class="footer">
      <div class="left">
        <button class="btn-ghost" onclick="goMenu()">Главное меню</button>
        ${current>0?`<button class="btn-ghost" onclick="prev()">Назад</button>`:''}
      </div>
      <button class="btn-primary" id="nextBtn" ${answers[q.id]!==undefined?'':'disabled'} onclick="next()">
        ${current===total-1?'Показать результат':'Далее'}
      </button>
    </div>`;
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectAnswer(id, value, isText){
  answers[id] = value;
  if (!isText){
    document.querySelectorAll('input[name="'+id+'"]').forEach(inp=>{
      const lbl = inp.closest('.opt,.scale-opt');
      if (lbl) lbl.classList.toggle('selected', inp.checked);
    });
  }
  const btn = document.getElementById('nextBtn');
  if (btn) btn.disabled = false;
  updateProgress();
}

function toggleMulti(id, el){
  const q = allQuestions.find(x => x.id === id);
  const
